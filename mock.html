<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #1a1d23; padding: 12px; font: 12px system-ui; color: #cfd4de; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .cell { background: #2a2f38; border-radius: 10px; padding: 8px; }
  .box { position: relative; width: 100%; aspect-ratio: 1; }
  .box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom; }
  .hat { position: absolute; top: 0; left: 50%; transform: translate(-50%, -14%); width: 62%; }
  .name { text-align: center; margin-top: 6px; color: #8d96a5; }
</style>
</head>
<body>
<div class="row">
  <div class="cell"><div class="box"><img src="guys/expansion_pack_1/alien_scare.png"><svg class="hat" viewBox="0 0 100 46"><rect x="4" y="30" width="92" height="9" rx="4" fill="#141414"/><rect x="24" y="2" width="52" height="32" rx="6" fill="#141414"/><rect x="24" y="18" width="52" height="7" fill="#c0392b"/></svg></div><div class="name">Alien Scare</div></div>
  <div class="cell"><div class="box"><img src="guys/expansion_pack_1/blush.png"><svg class="hat" viewBox="0 0 100 46"><rect x="4" y="30" width="92" height="9" rx="4" fill="#141414"/><rect x="24" y="2" width="52" height="32" rx="6" fill="#141414"/><rect x="24" y="18" width="52" height="7" fill="#c0392b"/></svg></div><div class="name">Blush</div></div>
  <div class="cell"><div class="box"><img src="guys/expansion_pack_1/crazyness.png"><svg class="hat" viewBox="0 0 100 46"><rect x="4" y="30" width="92" height="9" rx="4" fill="#141414"/><rect x="24" y="2" width="52" height="32" rx="6" fill="#141414"/><rect x="24" y="18" width="52" height="7" fill="#c0392b"/></svg></div><div class="name">Crazyness</div></div>
  <div class="cell"><div class="box"><img src="guys/expansion_pack_1/creepy_grin.png"><svg class="hat" viewBox="0 0 100 46"><rect x="4" y="30" width="92" height="9" rx="4" fill="#141414"/><rect x="24" y="2" width="52" height="32" rx="6" fill="#141414"/><rect x="24" y="18" width="52" height="7" fill="#c0392b"/></svg></div><div class="name">Creepy Grin</div></div>
  <div class="cell"><div class="box"><img src="guys/expansion_pack_1/meanness_mode.png"><svg class="hat" viewBox="0 0 100 46"><rect x="4" y="30" width="92" height="9" rx="4" fill="#141414"/><rect x="24" y="2" width="52" height="32" rx="6" fill="#141414"/><rect x="24" y="18" width="52" height="7" fill="#c0392b"/></svg></div><div class="name">Meanness Mode</div></div>
  <div class="cell"><div class="box"><img src="guys/expansion_pack_1/pleased.png"><svg class="hat" viewBox="0 0 100 46"><rect x="4" y="30" width="92" height="9" rx="4" fill="#141414"/><rect x="24" y="2" width="52" height="32" rx="6" fill="#141414"/><rect x="24" y="18" width="52" height="7" fill="#c0392b"/></svg></div><div class="name">Pleased</div></div>
  <div class="cell"><div class="box"><img src="guys/expansion_pack_1/sad_nose.png"><svg class="hat" viewBox="0 0 100 46"><rect x="4" y="30" width="92" height="9" rx="4" fill="#141414"/><rect x="24" y="2" width="52" height="32" rx="6" fill="#141414"/><rect x="24" y="18" width="52" height="7" fill="#c0392b"/></svg></div><div class="name">Sad Nose</div></div>
  <div class="cell"><div class="box"><img src="guys/expansion_pack_1/smiley.svg"><svg class="hat" viewBox="0 0 100 46"><rect x="4" y="30" width="92" height="9" rx="4" fill="#141414"/><rect x="24" y="2" width="52" height="32" rx="6" fill="#141414"/><rect x="24" y="18" width="52" height="7" fill="#c0392b"/></svg></div><div class="name">Smiley</div></div>
  <div class="cell"><div class="box"><img src="guys/expansion_pack_1/cool_blue.svg"><svg class="hat" viewBox="0 0 100 46"><rect x="4" y="30" width="92" height="9" rx="4" fill="#141414"/><rect x="24" y="2" width="52" height="32" rx="6" fill="#141414"/><rect x="24" y="18" width="52" height="7" fill="#c0392b"/></svg></div><div class="name">Cool Blue</div></div>
</div>
</body>
</html>
